# Streamlit 项目配置
[server]
runOnSave = true          # 代码保存即热更新,所有已打开的页面自动重载

[client]
toolbarMode = "minimal"   # 隐藏 Deploy 按钮和开发者菜单(内网工具用不上)

# 设计令牌与 polabel2 DESIGN.md 对齐:蓝主色/灰线/紧凑圆角
# (polabel2: --primary #2563eb --line #e2e8f0 --body #f1f5f9 --ink #1e293b)
[theme]
base = "light"
primaryColor = "#2563eb"              # 操作按钮/选中态/链接
backgroundColor = "#f1f5f9"           # 主区背景(点阵由 CSS 叠加)
secondaryBackgroundColor = "#ffffff"  # 卡片/侧边栏/弹窗
textColor = "#1e293b"
font = "sans serif"
baseRadius = "small"                  # 6px 圆角,紧凑操作台风格
borderColor = "#e2e8f0"
showSidebarBorder = true
