# 推送 main 后自动部署到宝塔服务器
# 机制:服务器端宝塔 WebHook 插件收到触发后执行
#       /www/server/panel/plugin/webhook/script/<access_key>
#       → bash /www/wwwroot/amcheck_git/deploy.sh(git fetch → reset → pip → 重启 → 健康检查)
# 前置:仓库 Secret BT_WEBHOOK_URL = 宝塔 WebHook 完整 URL(含 access_key)
# 访问入口: https://amcheck.usfan.net → Nginx 反代到 127.0.0.1:8765

name: 部署到宝塔

on:
  push:
    branches: [main]
    paths: ['code/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 触发宝塔 WebHook(git 拉取 + 重启 + 健康检查)
        env:
          WEBHOOK_URL: ${{ secrets.BT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          code=$(curl -sk -o /tmp/hook_resp.txt -w '%{http_code}' \
            --max-time 120 "$WEBHOOK_URL&param=github-${GITHUB_SHA::7}")
          echo "HTTP $code · 响应: $(cat /tmp/hook_resp.txt)"
          # 宝塔 webhook 受理即回 {"code":1};部署结果以服务器 deploy.log 的 DEPLOY_OK 为准
          [ "$code" = "200" ] || { echo "WebHook 触发失败" >&2; exit 1; }
